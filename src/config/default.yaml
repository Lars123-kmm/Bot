# ---- Core ----
symbol: "BTCUSDT"
timeframe: "H1"
timezone: "UTC"

# ---- Data ----
data:
  bars: 5000

# ---- Strategy: Multi-Filter EMA-Crossover ----
strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  adx_threshold: 25          # ADX > 25 = aktiver Trend
  rsi_period: 14
  rsi_long_min: 40
  rsi_long_max: 65
  rsi_short_min: 35
  rsi_short_max: 60
  volume_ma_period: 20
  volume_ratio_min: 1.2      # Vol > 1.2x MA(20)
  extended_max_pct: 3.0      # Long: Preis < 3% über EMA(20)
  atr_period: 14
  atr_stop_mult: 2.0         # SL = Entry +/- 2*ATR
  atr_tp_mult: 3.0           # TP = Entry +/- 3*ATR
  trailing_activate_atr: 1.5 # Trailing aktiv ab +1.5 ATR Gewinn
  trailing_distance_atr: 1.0 # Trailing-Abstand: 1 ATR vom Hochpunkt
  time_exit_bars: 48         # Max. 48 Bars in Position (bei 1h = 48h)
  signal_on_close: true

# ---- Risk ----
risk:
  account_risk_per_trade: 0.01  # 1% pro Trade
  max_total_drawdown: 0.10      # Circuit-Breaker bei 10% Gesamt-DD
  max_daily_drawdown: 0.02
  max_consecutive_losses: 5
  cooldown_minutes: 30
  max_spread_atr_ratio: 0.15

# ---- Execution (MT5) ----
execution:
  mode: "demo"              # demo | live
  magic_number: 240101
  slippage_points: 10
  deviation_points: 20

# ---- Machine Learning (Meta-Labeling) ----
ml:
  enabled: true
  min_probability: 0.55        # Mindest-Konfidenz für Trade-Freigabe
  model_path: "models/"        # Verzeichnis für gespeicherte Modelle

  # Triple-Barrier-Labeling
  label_upper_mult: 2.0        # TP-Barriere: 2 * ATR
  label_lower_mult: 2.0        # SL-Barriere: 2 * ATR
  label_max_bars: 48

  # Walk-Forward
  train_bars: 2000             # ~83 Tage bei H1
  test_bars: 500               # ~21 Tage
  step_bars: 250
  purge_bars: 48               # Gap zwischen Train/Test (verhindert Leakage)

  # LightGBM (Startparameter, werden durch Optuna optimiert)
  lgbm_num_leaves: 50
  lgbm_learning_rate: 0.05
  lgbm_n_estimators: 200
  lgbm_min_child_samples: 20

# ---- Regime-Erkennung ----
regime:
  enabled: true
  window: 100                  # Rolling-Window in Bars für Hurst + Vola
  hurst_trend_threshold: 0.55  # H > 0.55 = Trending
  hurst_range_threshold: 0.45  # H < 0.45 = Mean-Reverting
  vol_volatile_threshold: 0.80 # > 80% annualisierte Vola = VOLATILE
  adx_min_for_trend: 22        # ADX-Bestätigung für Trend-Klassifikation
  half_size_in_volatile: true  # Halbes Sizing bei VOLATILE-Regime

# ---- Bar-Typ ----
bars:
  type: "time"              # "time" | "dollar" | "volume"
  target_bars_per_day: 50   # Ziel-Bars/Tag für Dollar-/Volume-Bars

# ---- Binance Enrichment (Public API, kein Key nötig) ----
binance:
  enabled: false            # true = Funding Rate + OI + OBI als Features
  symbol: "BTCUSDT"         # Perpetuals-Symbol auf Binance Futures
  order_book_levels: 5      # Top-k Levels für OBI

# ---- HMM Regime ----
hmm:
  enabled: true
  n_components: 2           # 2-State HMM
  model_path: "models/hmm_detector.pkl"
  retrain_bars: 2000        # HMM auf letzten N Bars trainieren

# ---- Champion-Challenger ----
champion_challenger:
  enabled: true
  n_windows_needed: 3       # Consecutive OOS-Wins für Promotion
  metric: "sharpe"          # Vergleichsmetrik: sharpe | auc

# ---- Online-Lernen (River ARF) ----
online_model:
  enabled: true
  blend_weight: 0.3         # Anteil ARF im finalen Blend (0 = deaktiviert)
  model_path: "models/online_filter.pkl"
