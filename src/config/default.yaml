# ---- Core ----
symbol: "BTCUSDT"
timeframe: "H1"
timezone: "UTC"

# ---- Data ----
data:
  bars: 5000

# ---- Strategy: Multi-Filter EMA-Crossover ----
strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  adx_threshold: 25          # ADX > 25 = aktiver Trend
  rsi_period: 14
  rsi_long_min: 40
  rsi_long_max: 65
  rsi_short_min: 35
  rsi_short_max: 60
  volume_ma_period: 20
  volume_ratio_min: 1.2      # Vol > 1.2x MA(20)
  extended_max_pct: 3.0      # Long: Preis < 3% über EMA(20)
  atr_period: 14
  atr_stop_mult: 2.0         # SL = Entry +/- 2*ATR
  atr_tp_mult: 3.0           # TP = Entry +/- 3*ATR
  trailing_activate_atr: 1.5 # Trailing aktiv ab +1.5 ATR Gewinn
  trailing_distance_atr: 1.0 # Trailing-Abstand: 1 ATR vom Hochpunkt
  time_exit_bars: 48         # Max. 48 Bars in Position (bei 1h = 48h)
  signal_on_close: true

# ---- Risk ----
risk:
  account_risk_per_trade: 0.01  # 1% pro Trade
  max_total_drawdown: 0.10      # Circuit-Breaker bei 10% Gesamt-DD
  max_daily_drawdown: 0.02
  max_consecutive_losses: 5
  cooldown_minutes: 30
  max_spread_atr_ratio: 0.15

# ---- Execution (MT5) ----
execution:
  mode: "demo"              # demo | live
  magic_number: 240101
  slippage_points: 10
  deviation_points: 20
